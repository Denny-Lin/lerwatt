name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # The target is ARM64; x86_64 keeps the code portable.
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Model and closed-loop tests
        run: make test
      - name: End to end (simulator + controller, restore, crash recovery)
        run: make e2e
